name: Update PR dashboard

on:
  workflow_dispatch:
  schedule:
    # GitHub can't notify this repo about PRs in other people's repos, so poll.
    # Every 5 minutes is GitHub's minimum; runs can be delayed under load.
    - cron: "*/5 * * * *"
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-pr-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: pr-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate PR dashboard
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_pr_dashboard.py

      - name: Commit updated dashboard when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/pr-dashboard
          if ! git diff --cached --quiet; then
            git commit -m "chore: update open-source PR dashboard"
            git pull --rebase
            git push
          else
            echo "Dashboard is already up to date."
          fi
