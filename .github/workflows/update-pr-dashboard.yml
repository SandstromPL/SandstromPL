name: Update PR dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  push:
    paths:
      - "scripts/update_pr_dashboard.py"
      - ".github/workflows/update-pr-dashboard.yml"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate repository-wise PR dashboard
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_pr_dashboard.py

      - name: Commit updated README when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update open-source PR dashboard"
            git push
          else
            echo "README is already up to date."
          fi
